name: validate-forums

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-repository-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: repository-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact event head without persisting credentials
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $basic = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN")
          )
          git -c "http.extraheader=AUTHORIZATION: basic $basic" fetch `
            --no-tags --depth=1 origin $env:EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'Exact-head fetch failed.'
          }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Exact-head checkout failed.'
          }
          $actualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $env:EXPECTED_SHA) {
            throw "Checked out SHA does not match the event head."
          }
          git remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY.git"

      - name: Run fail-closed repository contract
        shell: pwsh
        run: ./scripts/check-repository.ps1
