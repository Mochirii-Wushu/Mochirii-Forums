name: validate-forums

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-repository-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: repository-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MOCHIRII_FORUMS_PYTHON_ACCEPTANCE_ROOT_SHA256: 72c920501378b0ffbbb679d605f57ab802c06f3298a77b8cbd10fcc9577e8b9d
    steps:
      - name: Check out exact event head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Bind checkout to the exact event head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

      - name: Run fail-closed offline repository contract
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Run required root Linux quarantine transaction contract
        shell: bash
        run: |
          set -euo pipefail
          validator_sha256="$(sha256sum -- scripts/validate-repository.py | awk '{print $1}')"
          contract_sha256="$(sha256sum -- scripts/test-contracts.py | awk '{print $1}')"
          [[ "$validator_sha256" == 86b31cb000de32830165e10c4e93d91c22215ead8b6ae34212e283c965ee1ba5 ]]
          [[ "$contract_sha256" == c71fdbb50065245b5c965c63931c46cf36d4d8bc34d2877b7ffb1a477203bb1f ]]
          observed_python_acceptance_root_sha256="$(printf 'mochirii-forums-python-acceptance-root-v1\0%s\0%s\n' "$validator_sha256" "$contract_sha256" | sha256sum | awk '{print $1}')"
          [[ "$observed_python_acceptance_root_sha256" == "$MOCHIRII_FORUMS_PYTHON_ACCEPTANCE_ROOT_SHA256" ]]
          sudo -n env -i \
            HOME=/root \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            LC_ALL=C.UTF-8 \
            /usr/bin/python3 -I -S -B scripts/test-contracts.py

  trusted-online-pins:
    name: trusted-online-pins
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind trusted online gate to exact current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Verify exact upstream bytes with read-only API authentication
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-repository.ps1 -Online
