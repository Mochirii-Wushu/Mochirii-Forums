name: deploy-forums

'on':
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      mode:
        description: Official launcher operation
        required: true
        type: choice
        options:
          - bootstrap
          - rebuild
      confirmation:
        description: Type DEPLOY MOCHIRII FORUMS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forums-production
  cancel-in-progress: false

jobs:
  deploy:
    name: protected-exact-release
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: forums-production
    steps:
      - name: Enforce exact dispatch authority
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CONFIRMATION" == 'DEPLOY MOCHIRII FORUMS' ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODE" == bootstrap || "$MODE" == rebuild ]]

      - name: Check out exact release without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.release_commit }}

      - name: Bind exact release to current main
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$RELEASE_COMMIT" ]]

      - name: Verify release source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-repository.ps1 -Online

      - name: Build secret-free immutable release archive
        id: archive
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/mochirii-forums-${RELEASE_COMMIT}.tar"
          git -c tar.umask=0002 archive --format=tar --output="$archive" "$RELEASE_COMMIT"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          size="$(stat -c '%s' "$archive")"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Transfer release and invoke root-owned deployer
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
          ARCHIVE_DIGEST: ${{ steps.archive.outputs.digest }}
          ARCHIVE_SIZE: ${{ steps.archive.outputs.size }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          MODE: ${{ inputs.mode }}
          DEPLOY_HOST: ${{ secrets.FORUMS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FORUMS_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.FORUMS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOST: ${{ secrets.FORUMS_DEPLOY_KNOWN_HOST }}
        run: |
          set -euo pipefail
          transport_dir="$(mktemp -d)"
          cleanup() {
            rm -rf -- "$transport_dir"
          }
          trap cleanup EXIT
          key="$transport_dir/key"
          known_hosts="$transport_dir/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > "$known_hosts"
          chmod 0600 "$key" "$known_hosts"
          ssh_options=(-T -i "$key" -o BatchMode=yes -o ClearAllForwardings=yes -o IdentitiesOnly=yes -o RequestTTY=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts")
          ssh "${ssh_options[@]}" -- \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "receive ${RELEASE_COMMIT} ${ARCHIVE_DIGEST} ${ARCHIVE_SIZE}" <"$ARCHIVE"
          ssh "${ssh_options[@]}" -- \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy ${RELEASE_COMMIT} ${ARCHIVE_DIGEST} ${ARCHIVE_SIZE} ${MODE}"
