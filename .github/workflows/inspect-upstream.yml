name: inspect-forums-upstream

'on':
  workflow_dispatch:
  schedule:
    - cron: '17 22 3 * *'
      timezone: Asia/Singapore

permissions:
  contents: read

concurrency:
  group: inspect-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact event head without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact event head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne '${{ github.sha }}') {
            throw 'Checked out SHA does not match the event head.'
          }

      - name: Validate the governance contract
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Verify pinned official bytes and recorded upstream drift
        shell: pwsh
        run: ./scripts/verify-upstream-provenance.ps1 -Online -RequireCurrentMain
