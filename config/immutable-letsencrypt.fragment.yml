                path_or_name,
                dir_fd=directory_fd,
                follow_symlinks=False,
            )
            if not valid_directory(metadata, exact_mode=exact_mode):
                raise ValueError
            descriptor = os.open(path_or_name, DIRECTORY_FLAGS, dir_fd=directory_fd)
            try:
                opened = os.fstat(descriptor)
                if (
                    metadata_identity(opened) != metadata_identity(metadata)
                    or not valid_directory(opened, exact_mode=exact_mode)
                ):
                    raise ValueError
            except BaseException:
                os.close(descriptor)
                raise
            return descriptor, metadata_identity(opened)


