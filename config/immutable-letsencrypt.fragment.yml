        import os
        import stat
        import sys

        DIRECTORY_FLAGS = os.O_RDONLY | os.O_CLOEXEC | os.O_DIRECTORY | os.O_NOFOLLOW
        FILE_FLAGS = os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW


        def metadata_identity(metadata):
            return (
                metadata.st_dev,
                metadata.st_ino,
                metadata.st_mode,
                metadata.st_uid,
                metadata.st_gid,
                metadata.st_nlink,
                metadata.st_size,
                metadata.st_mtime_ns,
                metadata.st_ctime_ns,
            )


        def valid_directory(metadata, *, exact_mode=None):
            mode = stat.S_IMODE(metadata.st_mode)
            return (
                stat.S_ISDIR(metadata.st_mode)
                and not stat.S_ISLNK(metadata.st_mode)
                and metadata.st_uid == 0
                and metadata.st_gid == 0
                and (mode & 0o500) == 0o500
                and (mode & 0o022) == 0
                and (mode & 0o7000) == 0
                and (exact_mode is None or mode == exact_mode)
            )


        def open_directory(path_or_name, *, exact_mode=None, directory_fd=None):
