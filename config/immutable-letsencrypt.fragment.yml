            chunks = []
            remaining = expected_size
            while remaining:
                chunk = os.read(descriptor, min(remaining, 65536))
                if not chunk:
                    raise ValueError
                chunks.append(chunk)
                remaining -= len(chunk)
            if os.read(descriptor, 1) != b"":
                raise ValueError
            return b"".join(chunks)


