                not stat.S_ISREG(metadata.st_mode)
                or stat.S_ISLNK(metadata.st_mode)
                or metadata.st_uid != 0
                or metadata.st_gid != 0
                or metadata.st_nlink != 1
                or metadata.st_size <= 0
                or metadata.st_size > maximum_bytes
                or (mode & 0o7000) != 0
            ):
                return False
            if kind == "internal":
                return mode == 0o600
            if kind == "installed-key":
                return mode in {0o400, 0o600}
            if kind == "installed-fullchain":
                return (mode & 0o400) != 0 and (mode & 0o022) == 0
            return False


        def open_file(directory_fd, name, *, kind, maximum_bytes):
            metadata = os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
            if not valid_file(metadata, kind=kind, maximum_bytes=maximum_bytes):
                raise ValueError
            descriptor = os.open(name, FILE_FLAGS, dir_fd=directory_fd)
            try:
