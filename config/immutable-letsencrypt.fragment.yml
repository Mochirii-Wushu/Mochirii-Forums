                raise ValueError


        def revalidate_file(directory_fd, name, descriptor, identity, *, kind, maximum_bytes):
            path_metadata = os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
            held_metadata = os.fstat(descriptor)
            if (
                metadata_identity(path_metadata) != identity
                or metadata_identity(held_metadata) != identity
                or not valid_file(path_metadata, kind=kind, maximum_bytes=maximum_bytes)
                or not valid_file(held_metadata, kind=kind, maximum_bytes=maximum_bytes)
            ):
                raise ValueError


        def main():
            shared_root, hostname, suffix = sys.argv[1:]
            if (
                shared_root != "/shared"
                or hostname != "forums.mochirii.com"
                or suffix not in {"", "_ecc"}
            ):
                raise ValueError
            directories = []
            files = []
            try:
                shared_fd, shared_identity = open_directory(shared_root)
                directories.append(shared_fd)
                letsencrypt_fd, letsencrypt_identity = open_directory(
                    "letsencrypt",
                    exact_mode=0o755,
                    directory_fd=shared_fd,
                )
                directories.append(letsencrypt_fd)
                installed_fd, installed_identity = open_directory(
                    "ssl",
                    directory_fd=shared_fd,
                )
                directories.append(installed_fd)
                internal_name = hostname + suffix
                internal_fd, internal_identity = open_directory(
                    internal_name,
                    exact_mode=0o700,
                    directory_fd=letsencrypt_fd,
                )
                directories.append(internal_fd)

                leaf_specs = (
                    (internal_fd, "fullchain.cer", "internal", 327680),
                    (internal_fd, hostname + ".key", "internal", 65536),
                    (installed_fd, hostname + suffix + ".cer", "installed-fullchain", 327680),
                    (installed_fd, hostname + suffix + ".key", "installed-key", 65536),
                )
                held = []
                for directory_fd, name, kind, maximum_bytes in leaf_specs:
                    descriptor, identity = open_file(
                        directory_fd,
                        name,
                        kind=kind,
                        maximum_bytes=maximum_bytes,
                    )
                    files.append(descriptor)
                    held.append((directory_fd, name, descriptor, identity, kind, maximum_bytes))
                values = [read_exact(item[2], item[3][6]) for item in held]
                if values[0] != values[2] or values[1] != values[3]:
                    raise ValueError
                for directory_fd, name, descriptor, identity, kind, maximum_bytes in held:
                    revalidate_file(
                        directory_fd,
                        name,
                        descriptor,
                        identity,
                        kind=kind,
                        maximum_bytes=maximum_bytes,
                    )
                revalidate_directory(
                    internal_name,
                    internal_fd,
                    internal_identity,
                    exact_mode=0o700,
                    directory_fd=letsencrypt_fd,
                )
                revalidate_directory(
                    "ssl",
                    installed_fd,
                    installed_identity,
                    directory_fd=shared_fd,
                )
                revalidate_directory(
                    "letsencrypt",
                    letsencrypt_fd,
                    letsencrypt_identity,
                    exact_mode=0o755,
                    directory_fd=shared_fd,
                )
                revalidate_directory(shared_root, shared_fd, shared_identity)
            finally:
                for descriptor in reversed(files):
                    os.close(descriptor)
                for descriptor in reversed(directories):
                    os.close(descriptor)


        try:
            main()
        except BaseException:
            os._exit(1)
        PY_INSTALLED
        )
        # MOCHIRII INSTALLED CERTIFICATE VALIDATOR END

        # MOCHIRII CERTIFICATE MATERIAL VALIDATOR BEGIN
        validate_certificate_material() (
          local certificate_suffix="$1"
          local expected_algorithm="$2"
          local expected_owner="$3"
          local certificate_directory
          local leaf_path
          local key_path
          local ca_path
          local fullchain_path
          local validation_root
          local canonical_leaf_path
          local expected_fullchain_path
          local leaf_public_path
          local key_public_path
          local leaf_der_path
          local untrusted_path
          local terminal_ca_path
          local san_output
          local leaf_public_algorithm
          local key_details
          local ca_count
          local ca_index
          local comparison_index
          local next_ca_index
          local ca_certificate_path
          local canonical_ca_path
          local ca_der_path
          local ca_purpose
          local file_size
          local validation_files=()

          case "${certificate_suffix}:${expected_algorithm}" in
            :rsa|_ecc:ecc) ;;
            *) return 1 ;;
          esac
          [[ "${expected_owner}" =~ ^[0-9]+:[0-9]+$ ]] || return 1
          certificate_directory="${letsencrypt_dir}/${DISCOURSE_HOSTNAME}${certificate_suffix}"
          test -d "${certificate_directory}" || return 1
          test ! -L "${certificate_directory}" || return 1
          test "$("${stat_bin}" -c '%u:%g %a' -- "${certificate_directory}" 2>/dev/null)" = \
            "${expected_owner} 700" || return 1
          leaf_path="${certificate_directory}/${DISCOURSE_HOSTNAME}.cer"
          key_path="${certificate_directory}/${DISCOURSE_HOSTNAME}.key"
          ca_path="${certificate_directory}/ca.cer"
          fullchain_path="${certificate_directory}/fullchain.cer"

          bounded_private_file() {
            local private_file="$1"
            local maximum_bytes="$2"
            test -f "${private_file}" || return 1
            test ! -L "${private_file}" || return 1
            test "$("${stat_bin}" -c '%u:%g %a %h' -- "${private_file}" 2>/dev/null)" = \
              "${expected_owner} 600 1" || return 1
            file_size="$("${stat_bin}" -c '%s' -- "${private_file}" 2>/dev/null)" || return 1
            [[ "${file_size}" =~ ^[0-9]+$ ]] || return 1
            (( file_size > 0 && file_size <= maximum_bytes )) || return 1
          }

          bounded_private_file "${leaf_path}" 65536 || return 1
          bounded_private_file "${key_path}" 65536 || return 1
          bounded_private_file "${ca_path}" 262144 || return 1
          bounded_private_file "${fullchain_path}" 327680 || return 1

          validation_root="$("${mktemp_bin}" -d \
            "${letsencrypt_dir}/.mochirii-acme-validate.XXXXXXXXXX" 2>/dev/null)" || return 1
          test -d "${validation_root}" || return 1
          test ! -L "${validation_root}" || return 1
          test "$("${stat_bin}" -c '%u:%g %a' -- "${validation_root}" 2>/dev/null)" = \
            "${expected_owner} 700" || return 1
          canonical_leaf_path="${validation_root}/leaf.pem"
          expected_fullchain_path="${validation_root}/fullchain.pem"
          leaf_public_path="${validation_root}/leaf-public.der"
          key_public_path="${validation_root}/key-public.der"
          leaf_der_path="${validation_root}/leaf.der"
          validation_files=(
            "${canonical_leaf_path}"
            "${expected_fullchain_path}"
            "${leaf_public_path}"
            "${key_public_path}"
            "${leaf_der_path}"
            "${validation_root}/untrusted.pem"
          )
          for ((ca_index=1; ca_index<=8; ca_index++)); do
            validation_files+=(
              "${validation_root}/ca-${ca_index}.pem"
              "${validation_root}/ca-${ca_index}-canonical.pem"
              "${validation_root}/ca-${ca_index}.der"
            )
          done
          cleanup_validation_root() {
            "${rm_bin}" -f -- "${validation_files[@]}" >/dev/null 2>&1 || :
            "${rmdir_bin}" -- "${validation_root}" >/dev/null 2>&1 || :
          }
          trap cleanup_validation_root EXIT

          "${openssl_bin}" x509 -in "${leaf_path}" -outform PEM \
            -out "${canonical_leaf_path}" >/dev/null 2>&1 || return 1
          "${cmp_bin}" -s -- "${leaf_path}" "${canonical_leaf_path}" || return 1
          "${openssl_bin}" x509 -in "${leaf_path}" -outform DER \
            -out "${leaf_der_path}" >/dev/null 2>&1 || return 1
          "${openssl_bin}" pkey -in "${key_path}" -noout -check >/dev/null 2>&1 || return 1
          ca_count="$("${awk_bin}" -v output_prefix="${validation_root}/ca-" '
            BEGIN { count=0; inside=0; failed=0 }
            function reject() { failed=1; exit 2 }
            $0 == "-----BEGIN CERTIFICATE-----" {
              if (inside || count >= 8) reject()
              inside=1
              count++
              target=output_prefix count ".pem"
              print $0 > target
              next
            }
            inside {
              print $0 > target
              if ($0 == "-----END CERTIFICATE-----") {
                close(target)
                inside=0
              }
              next
            }
            { reject() }
            END {
              if (failed || inside || count < 1) exit 2
              print count
            }
          ' "${ca_path}" 2>/dev/null)" || return 1
          [[ "${ca_count}" =~ ^[1-8]$ ]] || return 1
          for ((ca_index=1; ca_index<=ca_count; ca_index++)); do
            ca_certificate_path="${validation_root}/ca-${ca_index}.pem"
            canonical_ca_path="${validation_root}/ca-${ca_index}-canonical.pem"
            ca_der_path="${validation_root}/ca-${ca_index}.der"
            "${openssl_bin}" x509 -in "${ca_certificate_path}" -outform PEM \
              -out "${canonical_ca_path}" >/dev/null 2>&1 || return 1
            "${cmp_bin}" -s -- "${ca_certificate_path}" "${canonical_ca_path}" || return 1
            "${openssl_bin}" x509 -in "${ca_certificate_path}" -outform DER \
              -out "${ca_der_path}" >/dev/null 2>&1 || return 1
            if "${cmp_bin}" -s -- "${leaf_der_path}" "${ca_der_path}"; then
              return 1
            fi
            for ((comparison_index=1; comparison_index<ca_index; comparison_index++)); do
              if "${cmp_bin}" -s -- "${validation_root}/ca-${comparison_index}.der" \
                "${ca_der_path}"; then
                return 1
              fi
            done
            ca_purpose="$("${openssl_bin}" x509 -in "${ca_certificate_path}" \
              -purpose -noout 2>/dev/null)" || return 1
            case $'\n'"${ca_purpose}"$'\n' in
              *$'\nSSL server CA : Yes\n'*) ;;
              *) return 1 ;;
            esac
            "${openssl_bin}" x509 -in "${ca_certificate_path}" -checkend \
              "${certificate_minimum_lifetime_seconds}" -noout >/dev/null 2>&1 || return 1
          done
          "${openssl_bin}" verify -partial_chain -x509_strict -purpose sslserver \
            -no-CAfile -no-CApath -no-CAstore \
            -verify_hostname "${DISCOURSE_HOSTNAME}" \
            -CAfile "${validation_root}/ca-1.pem" \
            "${leaf_path}" >/dev/null 2>&1 || return 1
          for ((ca_index=1; ca_index<ca_count; ca_index++)); do
            next_ca_index=$((ca_index + 1))
            "${openssl_bin}" verify -partial_chain -x509_strict -purpose any \
              -no-CAfile -no-CApath -no-CAstore \
              -CAfile "${validation_root}/ca-${next_ca_index}.pem" \
              "${validation_root}/ca-${ca_index}.pem" >/dev/null 2>&1 || return 1
          done
          terminal_ca_path="${validation_root}/ca-${ca_count}.pem"
          if (( ca_count > 1 )); then
            untrusted_path="${validation_root}/untrusted.pem"
            : 2>/dev/null >"${untrusted_path}" || return 1
            for ((ca_index=1; ca_index<ca_count; ca_index++)); do
              "${cat_bin}" -- "${validation_root}/ca-${ca_index}.pem" \
                2>/dev/null >>"${untrusted_path}" || return 1
            done
            bounded_private_file "${untrusted_path}" 262144 || return 1
            "${openssl_bin}" verify -partial_chain -x509_strict -purpose sslserver \
              -no-CAfile -no-CApath -no-CAstore \
              -verify_hostname "${DISCOURSE_HOSTNAME}" \
              -untrusted "${untrusted_path}" -CAfile "${terminal_ca_path}" \
              "${leaf_path}" >/dev/null 2>&1 || return 1
          else
            "${openssl_bin}" verify -partial_chain -x509_strict -purpose sslserver \
              -no-CAfile -no-CApath -no-CAstore \
              -verify_hostname "${DISCOURSE_HOSTNAME}" \
              -CAfile "${terminal_ca_path}" \
              "${leaf_path}" >/dev/null 2>&1 || return 1
          fi
          "${openssl_bin}" crl2pkcs7 -nocrl -certfile "${ca_path}" 2>/dev/null | \
            "${openssl_bin}" pkcs7 -print_certs -noout >/dev/null 2>&1 || return 1
          "${openssl_bin}" crl2pkcs7 -nocrl -certfile "${fullchain_path}" 2>/dev/null | \
            "${openssl_bin}" pkcs7 -print_certs -noout >/dev/null 2>&1 || return 1
          "${cat_bin}" -- "${leaf_path}" "${ca_path}" 2>/dev/null >"${expected_fullchain_path}" || return 1
          "${cmp_bin}" -s -- "${fullchain_path}" "${expected_fullchain_path}" || return 1
          "${openssl_bin}" x509 -in "${leaf_path}" -pubkey -noout 2>/dev/null | \
